name: Build test APK (install on your phone)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Notification icon and permissions
        run: bash scripts/android-setup.sh

      - name: Native features (widget, alarms, calendar)
        env:
          DISABLE_WIDGET: ${{ vars.DISABLE_WIDGET }}
          DISABLE_ALARM: ${{ vars.DISABLE_ALARM }}
          DISABLE_CALENDAR: ${{ vars.DISABLE_CALENDAR }}
        run: bash scripts/android-native.sh

      - name: Generate launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Summary
        run: |
          echo "### Test APK ready" >> $GITHUB_STEP_SUMMARY
          echo "Download **test-apk** below, unzip it, and install app-debug.apk on your Android phone." >> $GITHUB_STEP_SUMMARY
          echo "This file is for testing only. Do not upload it to Google Play." >> $GITHUB_STEP_SUMMARY
